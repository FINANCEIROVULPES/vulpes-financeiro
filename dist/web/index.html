<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vulpes Financeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&display=swap">
<style>
/* Identidade Vulpes (vulpesag.com.br): laranja #E05A1C e #B84A16, preto #0D0D0D/#161616, creme #F4EFE6, branco.
   Tipografia: Barlow (texto) e Barlow Condensed (títulos, números, rótulos em caixa alta).
   Layout: barra lateral preta com o logotipo + área de trabalho clara em tom creme. */
:root {
  --vl: #E05A1C;
  --vl-dk: #B84A16;
  --bg: #f6f2eb;
  --surface: #ffffff;
  --surface-2: #faf7f2;
  --ink: #0D0D0D;
  --ink-2: #2b2824;
  --muted: #6f6960;
  --line: #e8e1d5;
  --line-strong: #d7cebf;
  --accent: #E05A1C;
  --accent-ink: #ffffff;
  --accent-soft: #fbe8dd;
  --accent-text: #B84A16;
  --side-bg: #0D0D0D;
  --side-ink: rgba(244, 239, 230, .72);
  --side-muted: rgba(244, 239, 230, .45);
  --side-active: #161616;
  --ok: #1d8a55;
  --ok-soft: #e2f3e9;
  --warn: #9a7300;
  --warn-soft: #f6eccb;
  --bad: #c62f3f;
  --bad-soft: #fbe5e7;
  --info: #2a62c9;
  --info-soft: #e4ecfb;
  --shadow: 0 1px 2px rgba(13, 13, 13, .04), 0 6px 18px rgba(13, 13, 13, .04);
  --shadow-lg: 0 24px 64px rgba(13, 13, 13, .28);
  --radius: 10px;
  --radius-sm: 4px;
  --font-display: "Barlow Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0D0D; --surface: #161616; --surface-2: #1b1b1b; --ink: #F4EFE6; --ink-2: #ddd6ca; --muted: #9c958a;
    --line: #272522; --line-strong: #37332e; --accent: #E05A1C; --accent-ink: #ffffff; --accent-soft: #2b1a11; --accent-text: #f08a55;
    --side-bg: #080808; --side-active: #161616;
    --ok: #49c486; --ok-soft: #13301f; --warn: #e0b23a; --warn-soft: #33290d; --bad: #f06b78; --bad-soft: #3a161b; --info: #7aa2f7; --info-soft: #17223a;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 24px 64px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0D0D; --surface: #161616; --surface-2: #1b1b1b; --ink: #F4EFE6; --ink-2: #ddd6ca; --muted: #9c958a;
  --line: #272522; --line-strong: #37332e; --accent: #E05A1C; --accent-ink: #ffffff; --accent-soft: #2b1a11; --accent-text: #f08a55;
  --side-bg: #080808; --side-active: #161616;
  --ok: #49c486; --ok-soft: #13301f; --warn: #e0b23a; --warn-soft: #33290d; --bad: #f06b78; --bad-soft: #3a161b; --info: #7aa2f7; --info-soft: #17223a;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 24px 64px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; text-transform: uppercase; }
h1 { font-size: 2.3rem; font-weight: 900; line-height: .95; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
h3 { font-size: 1rem; font-weight: 700; letter-spacing: .03em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); }
.num, .tnum, table { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--side-bg); color: var(--side-ink);
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 24px;
  padding: 22px 14px;
}
.brand { display: grid; gap: 8px; padding: 4px 8px 14px; border-bottom: 1px solid rgba(224, 90, 28, .14); }
.brand-logo { width: 168px; height: auto; display: block; }
.brand-emblem { width: 34px; height: 34px; display: none; }
.brand-sub { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-display); font-weight: 700; font-size: .78rem; letter-spacing: .26em; color: var(--vl); text-transform: uppercase; }
.brand-sub::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--vl); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  white-space: nowrap;
  display: flex; align-items: center; gap: 11px; padding: 10px 10px; border-radius: var(--radius-sm);
  color: var(--side-ink); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: .92rem; letter-spacing: .1em; text-transform: uppercase;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.nav a:hover { background: var(--side-active); color: #F4EFE6; }
.nav a:hover svg { color: var(--vl); opacity: 1; }
.nav a[aria-current="page"] { background: rgba(224, 90, 28, .1); color: #F4EFE6; box-shadow: inset 3px 0 0 var(--vl); }
.nav a[aria-current="page"] svg { opacity: 1; color: var(--vl); }
.nav .badge-count { margin-left: auto; background: var(--bad); color: #fff; border-radius: 999px; font-size: .7rem; padding: 1px 7px; font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid rgba(224, 90, 28, .14); font-size: .75rem; color: var(--side-muted); display: grid; gap: 4px; }
.side-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.side-foot .dot.local { background: var(--warn); }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1240px; margin: 0 auto; padding: 0 clamp(0px, 2vw, 16px); display: grid; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { display: inline-flex; align-items: center; gap: .5rem; background: var(--accent-soft); border: 1px solid rgba(224, 90, 28, .28); color: var(--accent-text);
  padding: .22rem .7rem; border-radius: 3px; font-weight: 700; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--vl); }
.eyebrow.light { background: rgba(224, 90, 28, .14); color: #f6a77b; border-color: rgba(224, 90, 28, .35); margin: 0 0 8px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; flex-direction: row; align-items: center; gap: 12px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side-bg); }
  .brand { padding: 0; border: 0; }
  .brand-logo, .brand-sub { display: none; }
  .brand-emblem { display: block; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; padding: 7px 10px; font-size: .84rem; }
  .nav a span.lbl { display: none; }
  .nav a[aria-current="page"] span.lbl { display: inline; }
  .nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  .side-foot { display: none; }
  .main { padding-block: 18px 48px; }
}

/* ---------- Cards & KPI ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .kpi { padding: 14px; } .kpi .k-value { font-size: 1.08rem; white-space: nowrap; } .kpi .k-icon { display: none; } }
.kpi { padding: 16px 18px; display: grid; gap: 6px; }
.kpi .k-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.kpi .k-icon { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.kpi .k-icon svg { width: 15px; height: 15px; }
.kpi .k-value { font-family: var(--font-display); font-size: 1.85rem; font-weight: 700; letter-spacing: 0; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .k-sub { font-size: .78rem; color: var(--muted); }
.kpi.ok .k-icon { background: var(--ok-soft); color: var(--ok); }
.kpi.warn .k-icon { background: var(--warn-soft); color: var(--warn); }
.kpi.bad .k-icon { background: var(--bad-soft); color: var(--bad); }
.kpi.bad .k-value { color: var(--bad); }
.kpi.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.kpi.dark .k-label, .kpi.dark .k-sub { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.kpi.dark .k-icon { background: rgba(224, 90, 28, .22); color: var(--vl); }
.kpi.dark { background: #0D0D0D; border-color: #0D0D0D; color: #F4EFE6; }
.kpi.dark .k-label, .kpi.dark .k-sub { color: rgba(244, 239, 230, .6); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1050px) { .grid-2, .grid-2b { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Buttons & form ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 13px; font-weight: 500; font-size: .86rem;
  cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn { font-weight: 600; }
.btn.primary { background: var(--vl); border-color: var(--vl); color: #fff; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; font-size: .8rem; }
.btn.primary:hover { background: var(--vl-dk); border-color: var(--vl-dk); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.wa { background: #1f9e57; border-color: #1f9e57; color: #fff; }
.btn.wa:hover { filter: brightness(1.06); background: #1f9e57; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 5px 9px; font-size: .8rem; }
.btn.icon { padding: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.cta { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .78rem; padding-block: 9px; }

.field { display: grid; gap: 5px; min-width: 0; }
.field label, .lbl-sm { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: .75rem; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius-sm);
  padding: 8px 11px; outline: none; min-width: 0;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.5; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: .84rem; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.search { position: relative; min-width: 0; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 33px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.toolbar .search { flex: 1 1 220px; }
.toolbar select.input { width: auto; flex: 0 1 auto; }
.check { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-family: var(--font-display); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
.cell-name { font-weight: 600; }
.cell-sub { font-size: .78rem; color: var(--muted); }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty svg { width: 30px; height: 30px; opacity: .5; }

/* ---------- Pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.no-dot::before { display: none; }
.pill.s-pago { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.s-aguardando { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.s-atraso { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.s-enviada { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.s-inativo { color: var(--muted); }
.pill.s-ativo { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.tag.pix { border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-text); }
.status-select { border: 0; border-radius: 999px; padding: 4px 26px 4px 10px; font-size: .76rem; font-weight: 600; cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 13px) 55%, calc(100% - 9px) 55%; background-size: 4px 4px; background-repeat: no-repeat; }
.status-select.s-pago { background-color: var(--ok-soft); color: var(--ok); }
.status-select.s-aguardando { background-color: var(--warn-soft); color: var(--warn); }
.status-select.s-atraso { background-color: var(--bad-soft); color: var(--bad); }
.status-select.s-enviada { background-color: var(--info-soft); color: var(--info); }
.status-select option { background: var(--surface); color: var(--ink); }

/* ---------- Lists ---------- */
.list { display: grid; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); min-width: 0; }
.list-item:first-child { border-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.datebox { width: 44px; flex: none; border-radius: 9px; border: 1px solid var(--line); text-align: center; padding: 4px 0; line-height: 1.1; background: var(--surface-2); }
.datebox b { display: block; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.datebox span { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.datebox.today { background: var(--accent); border-color: var(--accent); color: #fff; }
.datebox.today span { color: rgba(255,255,255,.8); }
.datebox.late { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: var(--bad-soft); color: var(--bad); }
.act-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent-text); }
.act-icon svg { width: 15px; height: 15px; }
.act-icon.ok { background: var(--ok-soft); color: var(--ok); }
.act-icon.info { background: var(--info-soft); color: var(--info); }

/* ---------- Chart ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 16px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

/* ---------- Billing center ---------- */
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(228px, 1fr)); gap: 16px; align-items: start; }
.lane-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.lane-head .count { white-space: nowrap; margin-left: auto; font-size: .78rem; color: var(--muted); font-weight: 600; }
.lane-head .dot { width: 9px; height: 9px; border-radius: 50%; }
.bill { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.bill:first-of-type { border-top: 0; }
.bill-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.bill-name { font-weight: 600; }
.bill-amt { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bill-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--muted); }
.bill-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.bill-actions .btn.cta { flex: 1 1 auto; }

/* ---------- Calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-dow { padding: 10px; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cal-day { min-height: 118px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day.out { background: var(--surface-2); }
.cal-day.out .d-num { opacity: .35; }
.cal-day.weekend { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
.cal-day.holiday { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }

tr.clickable { cursor: pointer; }

.settle .pill { border-color: transparent; }
.link-btn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--vl); text-underline-offset: 3px; }
tr.row-on td { background: var(--accent-soft); }

/* ---------- Login (versão web) ---------- */
.auth-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--side-bg); }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 28px 26px 22px; display: grid; gap: 6px; }
.auth-card h1 { font-size: 1.7rem; letter-spacing: .02em; }
.auth-card form { display: grid; gap: 14px; margin-top: 10px; }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.auth-brand img { width: 44px; height: 44px; object-fit: contain; background: var(--side-bg); border-radius: 10px; padding: 6px; }
.auth-brand strong { display: block; font-family: var(--font-display); font-size: 1.25rem; text-transform: uppercase; letter-spacing: .08em; line-height: 1; }
.auth-brand span { font-family: var(--font-display); font-weight: 700; font-size: .72rem; letter-spacing: .26em; color: var(--vl); text-transform: uppercase; }
.auth-sub { margin: 0; color: var(--muted); font-size: .9rem; }
.auth-btn { width: 100%; justify-content: center; padding-top: 11px; padding-bottom: 11px; }
.auth-btn:disabled { opacity: .6; cursor: progress; }
.auth-msg { margin: 0; min-height: 1.2em; font-size: .85rem; color: var(--ok); }
.auth-msg.bad { color: var(--bad); }
.auth-msg:empty { display: none; }
.auth-link { background: none; border: 0; padding: 4px 0; color: var(--accent-text); font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; justify-self: center; }
.side-user { color: var(--side-ink); }
.side-logout { background: none; border: 0; padding: 0; color: var(--vl); font: inherit; text-decoration: underline; cursor: pointer; }

</style>

/* Feriados nacionais do Brasil e cálculo de dias úteis (5º dia útil).
 * Fixos: Lei 662/1949 e alterações, incluindo 20/11 (Lei 14.759/2023, a partir de 2024).
 * Móveis: Sexta-feira Santa (feriado nacional). Opcional, ligado por padrão: Carnaval (seg e ter)
 * e Corpus Christi, que não são feriados nacionais por lei, mas não têm expediente bancário. */
(function (V) {
  'use strict';
  const U = V.util;

  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }

  const cache = new Map();
  /** Map AAAA-MM-DD → nome do feriado, para o ano. */
  function holidays(y, includeBankDays) {
    const key = y + ':' + (includeBankDays ? 1 : 0);
    if (cache.has(key)) return cache.get(key);
    const map = new Map();
    const fixed = [
      ['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'],
      ['09-07', 'Independência do Brasil'], ['10-12', 'Nossa Senhora Aparecida'], ['11-02', 'Finados'],
      ['11-15', 'Proclamação da República'], ['12-25', 'Natal'],
    ];
    if (y >= 2024) fixed.push(['11-20', 'Consciência Negra']);
    fixed.forEach(([md, name]) => map.set(y + '-' + md, name));
    const e = easter(y);
    const rel = (n) => { const d = new Date(e); d.setDate(d.getDate() + n); return U.ymd(d); };
    map.set(rel(-2), 'Sexta-feira Santa');
    if (includeBankDays) {
      map.set(rel(-48), 'Carnaval');
      map.set(rel(-47), 'Carnaval');
      map.set(rel(60), 'Corpus Christi');
    }
    cache.set(key, map);
    return map;
  }

  function holidayName(dateStr, includeBankDays) {
    return holidays(Number(dateStr.slice(0, 4)), includeBankDays).get(dateStr) || null;
  }

  function isBusinessDay(dateStr, includeBankDays) {
    const dow = U.parseYmd(dateStr).getDay();
    if (dow === 0 || dow === 6) return false;
    return !holidayName(dateStr, includeBankDays);
  }

  /** N-ésimo dia útil do mês (y, m 1-12). */
  function nthBusinessDay(y, m, n, includeBankDays) {
    let count = 0;
    const last = U.daysInMonth(y, m);
    for (let d = 1; d <= last; d++) {
      const s = y + '-' + U.pad(m) + '-' + U.pad(d);
      if (isBusinessDay(s, includeBankDays) && ++count === n) return s;
    }
    return y + '-' + U.pad(m) + '-' + U.pad(last);
  }

  /** Data de vencimento de um cliente num mês "AAAA-MM". */
  function dueDateFor(client, monthStr, includeBankDays) {
    const { y, m } = U.ymParts(monthStr);
    if (client.dueRule === 'bd5') return nthBusinessDay(y, m, 5, includeBankDays);
    const day = Math.min(Math.max(1, Number(client.dueDay) || 1), U.daysInMonth(y, m));
    return y + '-' + U.pad(m) + '-' + U.pad(day);
  }

  function dueRuleLabel(client) {
    return client.dueRule === 'bd5' ? '5º dia útil' : 'Dia ' + (Number(client.dueDay) || 1);
  }

  V.cal = { easter, holidays, holidayName, isBusinessDay, nthBusinessDay, dueDateFor, dueRuleLabel };
})(window.Vulpes = window.Vulpes || {});

/* Camada de dados. O app só conversa com a interface abaixo, então trocar o armazenamento
 * (por exemplo, por uma API própria) não exige mexer nas telas.
 *
 * Interface de um adaptador:
 *   kind: string                       identificação ("claude-db" | "local")
 *   subscribe(col, onData, onError)    onData(lista de {id, ...campos}, {definitive}) → função para cancelar
 *   set(col, id, data)                 grava o documento inteiro
 *   update(col, id, patch)             mescla campos num documento existente
 *   remove(col, id)                    apaga o documento
 *
 * Coleções: clients, charges (mensalidades, id = <clienteId>_<AAAA-MM>), jobs (serviços adicionais com parcelas),
 * expenses (cadastro de despesas), expenseEntries (lançamentos mensais de despesas), activity, settings (doc "main").
 */
(function (V) {
  'use strict';

  const COLLECTIONS = ['clients', 'charges', 'jobs', 'expenses', 'expenseEntries', 'settlements', 'activity', 'settings'];

  /* Uma escrita por vez para cada documento (exigência do armazenamento compartilhado). */
  function makeQueue() {
    const chains = new Map();
    return function enqueue(key, fn) {
      const prev = chains.get(key) || Promise.resolve();
      const next = prev.catch(() => {}).then(fn);
      chains.set(key, next);
      next.finally(() => { if (chains.get(key) === next) chains.delete(key); }).catch(() => {});
      return next;
    };
  }

  /* ---------- Armazenamento do Claude (artifact db): persiste no servidor ---------- */
  function ClaudeDbAdapter(db) {
    const enqueue = makeQueue();
    const withRetry = async (fn) => {
      try { return await fn(); } catch (e) {
        if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
        throw e;
      }
    };
    const strip = (data) => { const o = Object.assign({}, data); delete o.id; return JSON.parse(JSON.stringify(o)); };
    return {
      kind: 'claude-db',
      subscribe(col, onData, onError) {
        return db.collection(col).onSnapshot(
          (snap) => onData(snap.docs.map((d) => Object.assign({ id: d.id }, d.data())), { definitive: !snap.metadata.fromCache }),
          (err) => onError && onError(err),
        );
      },
      set(col, id, data) { return enqueue(col + '/' + id, () => withRetry(() => db.collection(col).doc(id).set(strip(data)))); },
      update(col, id, patch) { return enqueue(col + '/' + id, () => withRetry(() => db.collection(col).doc(id).update(strip(patch)))); },
      remove(col, id) { return enqueue(col + '/' + id, () => withRetry(() => db.collection(col).doc(id).delete())); },
    };
  }

  /* ---------- Armazenamento local (navegador): usado ao abrir o arquivo direto no computador ---------- */
  const LS_KEY = 'vulpes-financeiro:v1';

  function LocalAdapter(seed) {
    let mem = null;
    const listeners = new Map(COLLECTIONS.map((c) => [c, new Set()]));
    const load = () => {
      try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) { /* sem acesso ao armazenamento */ }
      return null;
    };
    const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(mem)); } catch (e) { V.ui && V.ui.toast('Não foi possível salvar neste navegador.', true); } };
    mem = load();
    if (!mem) {
      mem = { clients: {}, charges: {}, activity: {}, settings: {} };
      (seed && seed.clients || []).forEach((c) => { mem.clients[c.id] = c; });
      save();
    }
    COLLECTIONS.forEach((c) => { mem[c] = mem[c] || {}; });
    // Despesas iniciais entram uma única vez, também em navegadores que já tinham dados.
    if (!mem._seededExpenses) {
      (seed && seed.expenses || []).forEach((e) => { if (!mem.expenses[e.id]) mem.expenses[e.id] = Object.assign({}, e); });

    }
    if (!mem._seededPayers) {

      Object.keys(mem.expenseEntries || {}).forEach((k) => { if (k.indexOf('e_notebook_') === 0 && mem.expenseEntries[k].status !== 'pago') delete mem.expenseEntries[k]; });
      mem._seededPayers = true;
      save();
    }
    const list = (col) => Object.keys(mem[col]).map((id) => Object.assign({ id }, mem[col][id]));
    const emit = (col) => listeners.get(col).forEach((fn) => fn(list(col), { definitive: true }));

      if (e.key !== LS_KEY || !e.newValue) return;
      try { mem = JSON.parse(e.newValue); COLLECTIONS.forEach((c) => { mem[c] = mem[c] || {}; emit(c); }); } catch (err) { /* ignora */ }
    });

    return {
      kind: 'local',
      subscribe(col, onData) {
        listeners.get(col).add(onData);
        setTimeout(() => onData(list(col), { definitive: true }), 0);
        return () => listeners.get(col).delete(onData);

      async set(col, id, data) { mem[col][id] = clean(data); save(); emit(col); },
      async update(col, id, patch) {

    };

  const TABLES = { expenseEntries: 'expense_entries' };

  function SupabaseAdapter(sb) {
    const enqueue = makeQueue();
    const strip = (data) => { const o = JSON.parse(JSON.stringify(data)); delete o.id; return o; };
    const fail = (error) => {

    const withRetry = async (fn) => {

    async function fetchAll(table) {

        if (error) throw error;

      }
      return rows;
    }
    return {
      kind: 'supabase',
      subscribe(col, onData, onError) {
        const table = tableOf(col);
        const docs = new Map();
        let closed = false, loaded = false, pending = [];
        const emit = () => onData(Array.from(docs.entries()).map(([id, d]) => Object.assign({ id }, d)), { definitive: true });
        const apply = (p) => {
          if (p.eventType === 'DELETE') { if (p.old && p.old.id) docs.delete(p.old.id); } else if (p.new && p.new.id) docs.set(p.new.id, p.new.data || {});
        };

        const channel = sb.channel('vf-' + table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, (p) => {

          .subscribe((status, err) => {

          });

          if (closed) return;
          rows.forEach((r) => docs.set(r.id, r.data || {}));
          loaded = true; pending.forEach(apply); pending = [];
          emit();
        }).catch((e) => onError && onError(e));
        return () => { closed = true; sb.removeChannel(channel); };
      },
      set(col, id, data) {
        return enqueue(col + '/' + id, () => withRetry(() => sb.from(tableOf(col)).upsert({ id, data: strip(data) })));
      },
      update(col, id, patch) {
        return enqueue(col + '/' + id, () => withRetry(() => sb.rpc('mescla_campos', { tabela: tableOf(col), registro: id, campos: strip(patch) })));
      },
      remove(col, id) {
        return enqueue(col + '/' + id, () => withRetry(() => sb.from(tableOf(col)).delete().eq('id', id)));
      },
    };
  }

   * senão, o navegador. */

  }

})(window.Vulpes = window.Vulpes || {});

  let repo = null;
  const subs = new Set();
  function onChange(fn) { subs.add(fn); return () => subs.delete(fn); }
  function notify() { subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); }

  function settings() {
    const s = Object.assign({}, DEFAULT_SETTINGS, state.settingsDoc || {});

  /* ---------- Consultas ---------- */
  const clientById = (id) => state.clients.find((c) => c.id === id) || null;
  const activeClients = () => state.clients.filter((c) => c.status === 'ativo');
  /** Clientes ativos com mensalidade recorrente (clientes "só jobs" ficam de fora). */
  const retainerClients = () => activeClients().filter((c) => c.hasRetainer !== false);
  const chargesOf = (month) => state.charges.filter((c) => c.month === month);
  const chargeId = (clientId, month) => clientId + '_' + month;

  function isOverdue(ch, ref) { return ch.status !== 'pago' && !!ch.dueDate && ch.dueDate < (ref || U.today()); }
  /** Status exibido: "aguardando" vencido aparece como "em atraso" automaticamente. */
  function effStatus(ch, ref) {

    if (ch.status === 'enviada') return 'enviada';
    if (ch.status === 'atraso') return 'atraso';

  }

    if (ch.status === 'enviada' && ch.sentKind === 'atraso') return false;
    return true;
  }

  function monthSummary(month) {
    const t = U.today();
    const list = chargesOf(month);
    const sum = (arr, f) => arr.reduce((a, c) => a + (Number(f ? f(c) : c.amount) || 0), 0);
    const paid = list.filter((c) => c.status === 'pago');
    const late = list.filter((c) => isOverdue(c, t));
    const pending = list.filter((c) => c.status !== 'pago' && !isOverdue(c, t));
    return {
      list,
      expected: sum(list),
      received: sum(paid, (c) => (c.paidAmount != null ? c.paidAmount : c.amount)),
      pending: sum(pending), pendingCount: pending.length,
      late: sum(late), lateCount: late.length,
      paidCount: paid.length,
    };
  }
  function allOverdue() { const t = U.today(); return state.charges.filter((c) => isOverdue(c, t)); }

  /* ---------- Escrita ---------- */
  async function guard(promise, okMsg) {

      console.error(e);

        : code === 'invalid_argument' ? 'Você não tem permissão para alterar estes dados ou o registro não existe mais.'

  function log(type, text, extra) {

    repo.set('activity', id, doc).catch((e) => console.warn('activity', e));
    // Mantém o histórico de atividades enxuto (as mensalidades guardam o histórico financeiro).

      state.activity.slice().sort((a, b) => (a.at < b.at ? -1 : 1)).slice(0, state.activity.length - 400)
        .forEach((a) => repo.remove('activity', a.id).catch(() => {}));

  function buildCharge(client, month) {

      amount: Number(client.amount) || 0,
      dueDate: C.dueDateFor(client, month, s.bankDays),

      dueRule: data.dueRule === 'bd5' ? 'bd5' : 'fixed', dueDay: data.dueRule === 'bd5' ? 5 : Math.min(31, Math.max(1, Number(data.dueDay) || 1)),

  async function importBackup(data) {

/* Pagamentos: mensalidades por mês com filtros, status editável, registro de recebimento e histórico. */
(function (V) {
  'use strict';
  const U = V.util, S = V.store, I = V.ui;

  const PERIODS = [

    ['next7', 'Vence nos próximos 7 dias'], ['overdue', 'Já venceu'], ['range', 'Intervalo de datas…'],
  ];

  function months() {
    const set = new Set(S.state.charges.map((c) => c.month));
    set.add(U.currentYm());
    return Array.from(set).sort().reverse();
  }

  function filtered(f) {
    const t = U.today();
    const q = U.norm(f.q);
    return S.state.charges.filter((c) => {
      if (f.month && c.month !== f.month) return false;
      if (f.client && c.clientId !== f.client) return false;
      if (q && !U.norm(c.clientName).includes(q)) return false;
      if (f.method && c.paymentMethod !== f.method) return false;
      if (f.status && S.effStatus(c, t) !== f.status) return false;
      const day = Number((c.dueDate || '').slice(8));
      switch (f.period) {
        case 'd1': if (day > 10) return false; break;
        case 'd2': if (day < 11 || day > 20) return false; break;

  function lanes(q, kind) {
    const t = U.today();
    const s = S.settings();
    const soonLimit = U.addDays(t, Number(s.soonDays) || 5);
    const endOfMonth = U.currentYm() + '-31';
    const nq = U.norm(q);
    const open = V.jobs.allItems().filter((c) => c.status !== 'pago' && (!kind || c.kind === kind) &&
      (!nq || U.norm(c.clientName).includes(nq) || U.norm(c.title).includes(nq)));
    const byDue = (a, b) => ((a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : 0);
    const late = open.filter((c) => S.needsLateFollowUp(c, t)).sort(byDue);
    const lateIds = new Set(late.map((c) => c.id));
    const sent = open.filter((c) => c.status === 'enviada' && !lateIds.has(c.id)).sort(byDue);
    const rest = open.filter((c) => !lateIds.has(c.id) && c.status !== 'enviada' && (!c.dueDate || c.dueDate >= t));
    const soon = rest.filter((c) => c.dueDate && c.dueDate <= soonLimit).sort(byDue);
    const pending = rest.filter((c) => !c.dueDate || (c.dueDate > soonLimit && c.dueDate <= endOfMonth)).sort(byDue);
    return { late, soon, pending, sent, soonDays: Number(s.soonDays) || 5 };

      cells += '<div class="cal-day' + (out ? ' out' : '') + (k === t ? ' today' : '') + (hol && !out ? ' holiday' : '') + ((dow === 0 || dow === 6) && !out ? ' weekend' : '') + '">' +
        '<div class="d-top"><span class="d-num">' + d.getDate() + '</span>' + (items.length > 1 ? '<span class="d-total">' + U.moneyShort(items.reduce((a, e) => a + e.amount, 0)) + '</span>' : '') + '</div>' +
        (hol && !out ? '<div class="d-hol">' + U.esc(hol) + '</div>' : '') + items.map(ev).join('') + '</div>';
    }
    const days = Array.from(byDay.keys()).sort();
    const agenda = days.length ? days.map((k) => '<div class="list-item" style="align-items:flex-start">' + I.dateBox(k) + '<div class="grow" style="display:grid;gap:6px">' + byDay.get(k).map(ev).join('') + '</div></div>').join('') : I.empty('Nenhuma conta com data neste mês.', 'calendar');
    const undated = list.filter((e) => !e.dueDate && e.status !== 'pago');
    return '<div class="row small muted" style="gap:14px">' + ['pendente', 'pago', 'atraso', 'agendado'].map(statusPill).join('') + '<span>Contorno âmbar: vence em até ' + (Number(s.soonDays) || 5) + ' dias</span></div>' +
      '<div class="card cal-grid-card" style="overflow:hidden"><div class="cal">' + cells + '</div><div class="list cal-agenda">' + agenda + '</div></div>' +
      (undated.length ? '<div class="card"><div class="card-head"><div><h2>Sem data de vencimento</h2><p>Clique para informar a data. Ela passa a valer para os próximos meses se você editar a despesa no cadastro.</p></div></div><div class="card-pad undated">' + undated.map(ev).join('') + '</div></div>' : '');
  }

  function tabRelatorio(ui) {
    const month = ui.month, prevM = U.addMonths(month, -1);
    const sm = E.monthSummary(month), sp = E.monthSummary(prevM);
    const spent = sm.paid, prevSpent = sp.paid;
    const diff = E.round2(spent - prevSpent);
    const pct = prevSpent ? Math.round((diff / prevSpent) * 100) : null;
    const active = S.state.expenses.filter((e) => e.status !== 'encerrada' && !(e.type === 'parcela' && E.progress(e).finished));
    const structure = E.round2(active.filter((e) => e.type === 'fixa' || e.type === 'assinatura').reduce((a, e) => a + e.amount, 0));
    const instRunning = S.state.expenses.filter((e) => e.type === 'parcela' && !E.progress(e).finished);
    const instDone = S.state.expenses.filter((e) => e.type === 'parcela' && E.progress(e).finished);
    const stat = (label, value, sub, color) => '<div class="mini-stat"><span>' + label + '</span><b' + (color ? ' style="color:' + color + '"' : '') + '>' + value + '</b>' + (sub ? '<em>' + sub + '</em>' : '') + '</div>';
    const months = []; for (let i = 11; i >= 0; i--) months.push(U.addMonths(U.currentYm(), -i));
    const hist = months.map((m) => ({ m, s: E.monthSummary(m) })).filter((x) => x.s.list.length);
    const maxH = Math.max(1, ...hist.map((x) => x.s.expected));
    const catRows = sm.byCategory.map((g) => '<tr><td>' + U.esc(g.name) + '</td><td class="r">' + U.money(g.expected) + '</td><td class="r" style="color:var(--ok)">' + U.money(g.paid) + '</td><td class="r">' + (sm.expected ? Math.round((g.expected / sm.expected) * 100) : 0) + '%</td></tr>').join('');
    const instRow = (e) => { const p = E.progress(e); return '<div class="list-item" style="padding:10px 0"><div class="grow"><div class="cell-name">' + U.esc(e.name) + '</div><div class="cell-sub">' + U.money(e.amount) + ' por parcela · ' + p.paid + '/' + p.total + ' pagas' + (p.finished ? '' : ' · restam ' + U.money(p.remainingAmount)) + '</div></div><div class="bar" style="width:90px"><i style="width:' + (p.total ? (p.paid / p.total) * 100 : 0) + '%"></i></div></div>'; };
    return '<div class="mini-stats">' +
      stat('Total gasto no mês', U.money(spent), 'pago de ' + U.money(sm.expected) + ' previsto') +
      stat('Mês anterior', U.money(prevSpent), U.esc(U.monthLabel(prevM, { noYear: true }))) +
      stat('Variação', (diff > 0 ? '+' : '') + U.money(diff), pct == null ? 'sem base de comparação' : (pct > 0 ? '+' : '') + pct + '%', diff > 0 ? 'var(--bad)' : 'var(--ok)') +
      stat('Recorrentes', U.money(sm.recurring), 'fixas e assinaturas') +
      stat('Variáveis', U.money(sm.variable), 'gastos variáveis e eventuais') + '</div>' +
      '<div class="total-band card"><div><div class="eyebrow light">Custo para manter a estrutura da Vulpes</div><div class="tb-value">' + U.money(structure) + '<span> por mês</span></div></div>' +
      '<div class="tb-split"><div><span>Fixas</span><b>' + U.money(active.filter((e) => e.type === 'fixa').reduce((a, e) => a + e.amount, 0)) + '</b></div><div><span>Assinaturas</span><b>' + U.money(active.filter((e) => e.type === 'assinatura').reduce((a, e) => a + e.amount, 0)) + '</b></div><div><span>Parcelas ativas</span><b>' + U.money(instRunning.reduce((a, e) => a + e.amount, 0)) + '</b></div></div></div>' +
      '<div class="grid-2b">' +
      '<div class="card"><div class="card-head"><div><h2>Gastos por categoria</h2><p>' + U.esc(U.monthLabel(month)) + '</p></div></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Categoria</th><th class="r">Previsto</th><th class="r">Pago</th><th class="r">Peso</th></tr></thead><tbody>' + (catRows || '<tr><td colspan="4" class="muted">Sem dados.</td></tr>') + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-head"><div><h2>Parcelamentos</h2><p>' + instRunning.length + ' em andamento · ' + instDone.length + ' finalizados</p></div></div><div class="card-pad">' +
      '<div class="lbl-sm">Em andamento</div>' + (instRunning.map(instRow).join('') || '<div class="muted small">Nenhum.</div>') +
      '<div class="lbl-sm" style="margin-top:12px">Finalizados</div>' + (instDone.map(instRow).join('') || '<div class="muted small">Nenhum ainda.</div>') + '</div></div></div>' +
      '<div class="card"><div class="card-head"><div><h2>Histórico mensal</h2><p>Previsto e pago em cada mês. Clique para abrir o mês.</p></div></div><div class="card-pad"><div class="hist">' +
      (hist.length ? hist.map((x) => '<button class="hist-col' + (x.m === month ? ' on' : '') + '" data-act="exp-month" data-month="' + x.m + '" title="' + U.esc(U.monthLabel(x.m) + ': ' + U.money(x.s.expected) + ' previsto, ' + U.money(x.s.paid) + ' pago') + '">' +
        '<span class="hist-bars"><i style="height:' + (x.s.expected / maxH) * 100 + '%"></i><b style="height:' + (x.s.paid / maxH) * 100 + '%"></b></span><span class="hist-lbl">' + U.MONTHS_SHORT[U.ymParts(x.m).m - 1] + '</span><span class="hist-val">' + U.moneyShort(x.s.expected) + '</span></button>').join('') : '<div class="muted small">O histórico aparece conforme os meses passam.</div>') +
      '</div><div class="legend"><span><i style="background:var(--line-strong)"></i>Previsto</span><span><i style="background:var(--vl)"></i>Pago</span></div></div></div>';
  }

  /* ---------- Acerto entre sócias ---------- */
  function settleState(c) {
    const t = U.today();
    if (c.done) return ['x-pago', 'Acerto concluído'];
    if (c.record) return ['x-agendado', 'Acerto registrado · pendente'];
    if (!c.debtor && c.total) return ['x-pago', 'Nada a transferir'];
    if (!c.total) return ['', 'Sem despesas'];
    return t >= c.date ? ['x-atraso', 'Aguardando acerto'] : ['x-pendente', 'Fecha em ' + U.dateBR(c.date)];
  }
  function resultText(c) {
    if (!c.total) return 'Nenhuma despesa com responsável neste mês.';
    if (!c.debtor) return 'Tudo certo: as duas pagaram o mesmo valor.';
    return '<b>' + E.PARTNERS[c.debtor] + '</b> deve <b>' + U.money(c.amount) + '</b> para <b>' + E.PARTNERS[c.creditor] + '</b>.';
  }
  function settlePanel(month, compact) {
    const c = E.settlementCalc(month);
    const [stCls, stLabel] = settleState(c);
    const r = c.record;
    const row = (label, value, sub, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><th scope="row">' + label + (sub ? '<span>' + sub + '</span>' : '') + '</th><td>' + value + '</td></tr>';
    const nm = U.MONTHS[U.ymParts(month).m - 1];
    const doneLine = c.done ? '<div class="settle-done">' + I.icon('check') + '<span>' + U.esc(E.PARTNERS[r.from]) + ' transferiu <b>' + U.money(r.amount) + '</b> para ' + U.esc(E.PARTNERS[r.to]) + (r.date ? ' em ' + U.dateBR(r.date) : '') + '.</span></div>' : '';
    const warns = [];
    if (c.changedAfter) warns.push('Os lançamentos deste mês mudaram depois do acerto. ' + (Math.abs(c.pending) > 0.004 ? 'Ainda falta acertar <b>' + U.money(Math.abs(c.pending)) + '</b> (' + E.PARTNERS[c.pending > 0 ? 'natasha' : 'karol'] + ' para ' + E.PARTNERS[c.pending > 0 ? 'karol' : 'natasha'] + ').' : 'O valor transferido continua correto.'));
    if (c.unassigned.length) warns.push('<b>' + c.unassigned.length + (c.unassigned.length === 1 ? ' despesa' : ' despesas') + ' sem responsável</b> (' + c.unassigned.map((e) => U.esc(e.name)).join(', ') + ' · ' + U.money(c.unassignedTotal) + ') ainda não ' + (c.unassigned.length === 1 ? 'entra' : 'entram') + ' no acerto. Defina quem pagou na lista de contas.');
    if (c.openCount) warns.push(c.openCount + (c.openCount === 1 ? ' conta ainda não foi marcada' : ' contas ainda não foram marcadas') + ' como paga; ' + (c.openCount === 1 ? 'ela entra' : 'elas entram') + ' no cálculo pelo valor previsto, na conta de quem paga.');
    return '<section class="settle card" aria-labelledby="settle-' + month + '">' +
      '<div class="settle-head"><div><div class="eyebrow light">Acerto entre sócias · todo dia ' + E.SETTLE_DAY + '</div><h2 id="settle-' + month + '">Fechamento de ' + U.esc(nm) + '</h2>' +
      '<p>Acerto em ' + U.dateBR(c.date) + ' · total do mês dividido igualmente entre Karol e Natasha</p></div><span class="pill ' + stCls + '">' + stLabel + '</span></div>' +
      '<div class="settle-grid"><table class="settle-table"><tbody>' +
      row('Total pago por Karol', U.money(c.karol), c.countK + (c.countK === 1 ? ' conta' : ' contas'), 'k') +
      row('Total pago por Natasha', U.money(c.natasha), c.countN + (c.countN === 1 ? ' conta' : ' contas'), 'n') +
      row('Total de despesas', U.money(c.total), '', 'tot') +
      row('Parte de cada uma', U.money(c.share), 'total ÷ 2', 'share') +
      '</tbody></table>' +
      '<div class="settle-result"><span class="lbl">' + (c.done ? 'Situação do acerto' : 'Resultado do acerto') + '</span><p>' + (c.done ? (Math.abs(c.pending) > 0.004 ? 'Ainda falta: <b>' + E.PARTNERS[c.pending > 0 ? 'natasha' : 'karol'] + '</b> deve <b>' + U.money(Math.abs(c.pending)) + '</b> para <b>' + E.PARTNERS[c.pending > 0 ? 'karol' : 'natasha'] + '</b>.' : 'Acerto feito. Nada pendente neste mês.') : resultText(c)) + '</p>' + doneLine +
      '<div class="row"><button class="btn primary cta" data-act="settle-open" data-month="' + month + '">' + I.icon('cash') + (r ? 'Editar acerto' : 'Registrar acerto') + '</button>' +
      (compact ? '<button class="btn ghost light" data-act="exp-tab" data-val="acerto">Histórico</button>' : '') + '</div></div></div>' +
      (warns.length ? '<div class="settle-warns">' + warns.map((w) => '<div>' + I.icon('info') + '<span>' + w + '</span></div>').join('') + '</div>' : '') +
      '</section>';
  }
  function tabAcerto(ui) {
    const h = E.settlementHistory();
    const c = E.settlementCalc(ui.month);
    const who = (p) => (p ? U.esc(E.PARTNERS[p]) : '');
    const pend = h.pendingDebtor
      ? '<b>' + who(h.pendingDebtor) + '</b> deve <b>' + U.money(Math.abs(h.pendingNet)) + '</b> para <b>' + who(h.pendingDebtor === 'karol' ? 'natasha' : 'karol') + '</b>'
      : 'Nenhum valor pendente entre as sócias';
    const rows = h.rows.length ? h.rows.map((r) => {
      const [cls, label] = settleState(r);
      return '<tr' + (r.month === ui.month ? ' class="row-on"' : '') + '><td><button class="link-btn" data-act="exp-month" data-month="' + r.month + '">' + U.esc(U.monthLabel(r.month)) + '</button><div class="cell-sub">acerto em ' + U.dateBR(r.date) + '</div></td>' +
        '<td class="r tnum">' + U.money(r.karol) + '</td><td class="r tnum">' + U.money(r.natasha) + '</td><td class="r tnum"><b>' + U.money(r.total) + '</b></td><td class="r tnum">' + U.money(r.share) + '</td>' +
        '<td>' + (r.debtor ? who(r.debtor) + ' → ' + who(r.creditor) + ' <b class="tnum">' + U.money(r.amount) + '</b>' : '<span class="muted">—</span>') + '</td>' +
        '<td><span class="pill ' + cls + '">' + label + '</span>' + (r.record && r.record.date ? '<div class="cell-sub">' + (r.done ? 'transferido ' : 'previsto ') + U.dateBR(r.record.date) + (r.record.amount ? ' · ' + U.money(r.record.amount) : '') + '</div>' : '') + '</td>' +
        '<td class="r"><button class="btn sm" data-act="settle-open" data-month="' + r.month + '">' + (r.record ? I.icon('edit') + 'Editar' : I.icon('cash') + 'Registrar') + '</button></td></tr>';
    }).join('') : '<tr><td colspan="8">' + I.empty('Os fechamentos aparecem aqui conforme as despesas são lançadas.', 'calendar') + '</td></tr>';
    return settlePanel(ui.month) +
      '<div class="total-band card"><div><div class="eyebrow light">Saldo pendente entre as sócias · até ' + U.esc(U.monthLabel(U.currentYm(), { noYear: true })) + '</div><div class="tb-value" style="font-size:clamp(1.4rem,3vw,2rem)">' + pend + '</div></div>' +
      '<div class="tb-split"><div><span>Fechamentos</span><b>' + h.rows.filter((r) => r.month <= U.currentYm()).length + '</b></div><div><span>Concluídos</span><b>' + h.rows.filter((r) => r.done).length + '</b></div></div></div>' +
      '<div class="card"><div class="card-head"><div><h2>Histórico de fechamentos</h2><p>Cada mês tem o seu controle. Clique no mês para ver as contas dele; um fechamento não muda quando começa o mês seguinte.</p></div></div>' +
      '<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Mês</th><th class="r">Karol pagou</th><th class="r">Natasha pagou</th><th class="r">Total</th><th class="r">Parte de cada</th><th>Quem deve</th><th>Acerto</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-head"><div><h2>Quem pagou o quê em ' + U.esc(U.monthLabel(ui.month, { noYear: true })) + '</h2><p>Para trocar o responsável de uma conta só neste mês, use o seletor.</p></div></div>' +
      '<div class="grid-2" style="padding:12px 16px 16px;gap:16px">' + ['karol', 'natasha'].map((p) => {
        const l = c.list.filter((e) => E.payerOf(e) === p);
        return '<div><div class="lbl-sm">' + payerChip(p) + ' ' + U.money(p === 'karol' ? c.karol : c.natasha) + '</div>' + (l.length ? '<div class="list">' + l.map((e) => '<div class="list-item" style="padding:8px 0"><div class="grow"><div class="cell-name">' + U.esc(e.name) + instLabel(e) + '</div><div class="cell-sub">' + U.esc(E.TYPES[e.type] || '') + ' · ' + U.esc(E.STATUS[E.effStatus(e)]) + '</div></div><b class="tnum">' + U.money(e.status === 'pago' ? E.paidValue(e) : e.amount) + '</b>' + payerSelect(e) + '</div>').join('') + '</div>' : '<div class="muted small">Nenhuma conta.</div>') + '</div>';
      }).join('') + '</div>' +
      (c.unassigned.length ? '<div style="padding:0 16px 16px"><div class="lbl-sm">' + payerChip('') + '</div>' + c.unassigned.map((e) => '<div class="list-item" style="padding:8px 0"><div class="grow"><div class="cell-name">' + U.esc(e.name) + '</div></div><b class="tnum">' + U.money(e.amount) + '</b>' + payerSelect(e) + '</div>').join('') + '</div>' : '') + '</div>';
  }

  function settleModal(month) {
    const c = E.settlementCalc(month);
    const r = c.record || {};
    const from = r.from || c.debtor || 'natasha';
    const amount = r.amount != null ? r.amount : c.amount;
    const pOpts = (cur) => Object.keys(E.PARTNERS).map((k) => opt(k, E.PARTNERS[k], cur)).join('');
    I.modal({
      title: 'Registrar acerto de ' + U.monthLabel(month, { noYear: true }),
      sub: 'Transferência entre as sócias. Não conta como despesa da agência.',
      body: '<div class="notice">' + I.icon('info') + '<span>Cálculo do mês: total ' + U.money(c.total) + ', parte de cada uma ' + U.money(c.share) + '. ' + resultText(c) + '</span></div>' +
        '<form id="st-form" class="form-grid" novalidate>' +
        '<div class="field"><label for="st-date">Data da transferência</label><input class="input" type="date" id="st-date" name="date" value="' + U.esc(r.date || c.date) + '"></div>' +
        '<div class="field"><label for="st-amt">Valor transferido</label><input class="input tnum" id="st-amt" name="amount" inputmode="decimal" value="' + U.esc(String(amount).replace('.', ',')) + '"></div>' +
        '<div class="field"><label for="st-from">Quem transferiu</label><select class="input" id="st-from" name="from">' + pOpts(from) + '</select></div>' +
        '<div class="field"><label for="st-to">Quem recebeu</label><select class="input" id="st-to" name="to">' + pOpts(r.to || (from === 'karol' ? 'natasha' : 'karol')) + '</select></div>' +
        '<div class="field"><label for="st-status">Status do acerto</label><select class="input" id="st-status" name="status">' + Object.keys(E.SETTLE_STATUS).map((k) => opt(k, E.SETTLE_STATUS[k], r.status || 'concluido')).join('') + '</select></div>' +
        '<div class="field full"><label for="st-notes">Observação</label><input class="input" id="st-notes" name="notes" value="' + U.esc(r.notes || '') + '" placeholder="Opcional"></div></form>',
      foot: (c.record ? '<button class="btn danger" data-del>' + I.icon('trash') + 'Remover registro</button><span class="spacer"></span>' : '') + '<button class="btn" data-close>Cancelar</button><button class="btn primary" data-save>' + I.icon('check') + 'Salvar acerto</button>',
      onMount(el, close) {
        const f = el.querySelector('#st-form');
        f.from.addEventListener('change', () => { f.to.value = f.from.value === 'karol' ? 'natasha' : 'karol'; });
        f.to.addEventListener('change', () => { f.from.value = f.to.value === 'karol' ? 'natasha' : 'karol'; });
        const del = el.querySelector('[data-del]');
        if (del) del.addEventListener('click', async () => { if (await E.deleteSettlement(month)) close(); });
        el.querySelector('[data-save]').addEventListener('click', async () => {
          const d = I.formData(f);
          if (d.from === d.to) { I.toast('Quem transferiu e quem recebeu precisam ser pessoas diferentes.', true); return; }
          if (d.status === 'concluido' && !d.date) { I.toast('Informe a data da transferência.', true); f.date.focus(); return; }
          if (d.status === 'concluido' && !(U.parseMoney(d.amount) > 0) && c.debtor) { I.toast('Informe o valor transferido.', true); f.amount.focus(); return; }
          if (await E.saveSettlement(month, d)) close();
        });
      },
    });
  }

  function render(root, ui) {
    const sm = E.monthSummary(ui.month);
    const tab = ui.desp.tab;
    const body = tab === 'acerto' ? tabAcerto(ui) : tab === 'variaveis' ? tabVariaveis(ui) : tab === 'cadastro' ? tabCadastro() : tab === 'calendario' ? tabCalendario(ui) : tab === 'relatorio' ? tabRelatorio(ui) : tabContas(ui);
    // Atrasadas primeiro (para não pagar o mês seguinte por engano), depois as próximas.
    const upcoming = S.state.expenseEntries.filter((e) => e.status !== 'pago' && e.dueDate).sort((a, b) => (a.dueDate < b.dueDate ? -1 : 1)).slice(0, 6);
    root.innerHTML =
      '<div class="page-head"><div><div class="eyebrow">Contas a pagar</div><h1>Despesas</h1><p>Custos e saídas da agência, separados de mensalidades e jobs.</p></div>' +
      '<div class="row">' + V.views.painel.monthNav(ui.month) + '<button class="btn" data-act="exp-new-var">' + I.icon('plus') + 'Gasto variável</button><button class="btn primary cta" data-act="exp-new">' + I.icon('plus') + 'Adicionar despesa</button></div></div>' +
      kpis(sm) +
      (tab === 'contas' ? settlePanel(ui.month, true) : '') +
      (tab === 'contas' ? '<div class="grid-2"><div class="card"><div class="card-head"><div><h2>Despesas por categoria</h2><p>Onde estão concentrados os custos de ' + U.esc(U.monthLabel(ui.month, { noYear: true })) + '</p></div></div><div class="card-pad">' + categoryChart(sm) + '</div></div>' +
        '<div class="card"><div class="card-head"><div><h2>Contas em aberto</h2><p>Atrasadas e próximas, por data</p></div></div><div class="list" style="margin-top:10px">' +
        (upcoming.length ? upcoming.map((e) => '<div class="list-item">' + I.dateBox(e.dueDate) + '<div class="grow"><div class="title">' + U.esc(e.name) + instLabel(e) + '</div><div class="cell-sub">' + U.money(e.amount) + ' · ' + U.esc(U.monthLabel(e.month, { noYear: true })) + ' · ' + (E.isOverdue(e) ? '<span style="color:var(--bad);font-weight:600">venceu ' + U.relDays(e.dueDate) + '</span>' : U.relDays(e.dueDate)) + '</div></div><button class="btn sm" data-act="exp-pay" data-id="' + U.esc(e.id) + '">' + I.icon('check') + 'Pagar</button></div>').join('') : I.empty('Nenhuma conta com data pela frente. Defina as datas em "Definir data".', 'check')) +
        '</div></div></div>' : '') +
      '<div class="tabs" role="tablist">' + TABS.map(([k, l]) => '<button role="tab" data-act="exp-tab" data-val="' + k + '" aria-selected="' + (tab === k) + '">' + l + '</button>').join('') + '</div>' +
      body;
  }

/* Calendário financeiro: grade mensal com vencimentos, feriados e destaques de atraso e proximidade. */
(function (V) {
  'use strict';
  const U = V.util, S = V.store, I = V.ui, C = V.cal;

  function render(root, ui) {
    const month = ui.month;
    const { y, m } = U.ymParts(month);
    const s = S.settings();
    const t = U.today();
    const soonLimit = U.addDays(t, Number(s.soonDays) || 5);
    const list = S.chargesOf(month).map(V.jobs.fromCharge).concat(V.jobs.jobItems().filter((i) => i.month === month))
      .filter((c) => (!ui.cal.method || c.paymentMethod === ui.cal.method) && (!ui.cal.kind || c.kind === ui.cal.kind));
    const byDay = new Map();
    list.forEach((c) => { const k = c.dueDate; if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(c); });
    byDay.forEach((arr) => arr.sort((a, b) => U.norm(a.clientName).localeCompare(U.norm(b.clientName))));

    const ev = (c) => {
      const st = S.effStatus(c, t);
      const soon = c.status !== 'pago' && c.dueDate >= t && c.dueDate <= soonLimit;
      return '<button class="ev s-' + st + (soon ? ' soon' : '') + (c.kind === 'job' ? ' is-job' : '') + '" data-act="cal-ev" data-id="' + U.esc(c.key) + '" title="' + U.esc(c.clientName + (c.kind === 'job' ? ' · Job: ' + c.ref : '') + ' · ' + U.money(c.amount) + ' · ' + S.STATUS[st]) + '">' +
        '<b>' + (c.kind === 'job' ? '<i class="ev-job">JOB</i>' : '') + U.esc(c.clientName) + '</b><span>' + U.money(c.amount) + ' · ' + (c.kind === 'job' ? U.esc(c.title) : (c.paymentMethod === 'pix' ? 'PIX' : 'Boleto')) + '</span></button>';
    };

    // Grade começando no domingo.
    const first = new Date(y, m - 1, 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const last = new Date(y, m, 0);
    const end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
    let cells = U.WEEKDAYS_SHORT.map((d) => '<div class="cal-dow">' + d + '</div>').join('');
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const k = U.ymd(d);
      const out = d.getMonth() !== m - 1;
      const hol = C.holidayName(k, s.bankDays);
      const dow = d.getDay();
      const items = out ? [] : (byDay.get(k) || []);
      const total = items.reduce((a, c) => a + c.amount, 0);
      cells += '<div class="cal-day' + (out ? ' out' : '') + (k === t ? ' today' : '') + (hol && !out ? ' holiday' : '') + ((dow === 0 || dow === 6) && !out ? ' weekend' : '') + '">' +
        '<div class="d-top"><span class="d-num">' + d.getDate() + '</span>' + (items.length > 1 ? '<span class="d-total">' + U.moneyShort(total) + '</span>' : '') + '</div>' +
        (hol && !out ? '<div class="d-hol" title="' + U.esc(hol) + '">' + U.esc(hol) + '</div>' : '') +
        items.map(ev).join('') + '</div>';
    }

    // Agenda (telas pequenas).
    const days = Array.from(byDay.keys()).sort();
    const agenda = days.length ? days.map((k) => '<div class="list-item" style="align-items:flex-start">' + I.dateBox(k) +
      '<div class="grow" style="display:grid;gap:6px"><div class="cell-sub">' + U.esc(U.weekday(k)) + (C.holidayName(k, s.bankDays) ? ' · ' + U.esc(C.holidayName(k, s.bankDays)) : '') + '</div>' +
      byDay.get(k).map(ev).join('') + '</div></div>').join('') : I.empty('Nenhum vencimento neste mês.', 'calendar');

    const bd5 = C.nthBusinessDay(y, m, 5, s.bankDays);
    const hols = Array.from(C.holidays(y, s.bankDays).entries()).filter(([k]) => k.slice(0, 7) === month).sort();
    const sum = S.monthSummary(month);
    const jm = V.jobs.monthJobs(month);
    const kindBtn = (v, l) => '<button type="button" data-act="cal-kind" data-val="' + v + '" aria-pressed="' + ((ui.cal.kind || '') === v) + '">' + l + '</button>';
    const methodBtn = (v, l) => '<button type="button" data-act="cal-method" data-val="' + v + '" aria-pressed="' + (ui.cal.method === v) + '">' + l + '</button>';

    root.innerHTML =
      '<div class="page-head"><div><div class="eyebrow">Calendário financeiro</div><h1>' + U.esc(U.monthLabel(month)) + '</h1>' +
      '<p>5º dia útil: <b>' + U.dateBR(bd5) + '</b> (' + U.esc(U.weekday(bd5)) + ')' + (hols.length ? ' · Feriados: ' + hols.map(([k, n]) => U.esc(n) + ' (' + Number(k.slice(8)) + ')').join(', ') : '') + '</p></div>' +
      '<div class="row">' + V.views.painel.monthNav(month) + '<div class="seg" role="group" aria-label="Forma de pagamento">' + methodBtn('', 'Todas') + methodBtn('pix', 'PIX') + methodBtn('boleto', 'Boleto') + '</div>' +
      '<div class="seg" role="group" aria-label="Tipo">' + kindBtn('', 'Tudo') + kindBtn('mensalidade', 'Mensalidades') + kindBtn('job', 'Jobs') + '</div></div></div>' +
      '<div class="row small muted" style="gap:16px">' +
      '<span><span class="pill s-aguardando">Aguardando</span></span><span><span class="pill s-pago">Pago</span></span><span><span class="pill s-atraso">Em atraso</span></span><span><span class="pill s-enviada">Cobrança enviada</span></span>' +

/* Login da versão web (Supabase Auth).
 * - Entrar com e-mail e senha.
 * - "Primeiro acesso / esqueci a senha": envia um link por e-mail para criar uma senha nova.
 * - Ao abrir um link de convite ou de nova senha, pede a senha antes de entrar.
 * - Só entra quem está cadastrada como sócia (tabela socias). Outros e-mails veem um aviso.
 */
(function (V) {
  'use strict';
  const U = V.util;

  // Lê o tipo do link antes que o Supabase limpe o endereço (#access_token=...&type=invite|recovery).
  const rawHash = window.location.hash || '';
  const linkType = (/[#&]type=(invite|recovery|signup|magiclink)/.exec(rawHash) || [])[1] || null;
  const linkError = (/[#&]error_description=([^&]+)/.exec(rawHash) || [])[1] || null;

  let client = null;
  if (window.supabase && V.config && V.config.supabaseUrl) {
    client = window.supabase.createClient(V.config.supabaseUrl, V.config.supabaseKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' },
    });
  }

  const box = (inner) =>
    '<div class="auth-wrap"><div class="auth-card">' +
    '<div class="auth-brand"><img src="' + V.brand.emblem + '" alt="Vulpes"><div><strong>Vulpes</strong><span>Financeiro</span></div></div>' +
    inner + '</div></div>';

  function msg(el, text, bad) {
    const m = el.querySelector('[data-msg]');
    m.textContent = text || '';
    m.className = 'auth-msg' + (bad ? ' bad' : '');
  }

  function busy(btn, on, label) {
    btn.disabled = on;
    if (label) btn.textContent = on ? 'Aguarde…' : label;
  }

  function cleanUrl() {
    try { history.replaceState(null, '', window.location.pathname + '#painel'); } catch (e) { window.location.hash = 'painel'; }
  }

  function loginScreen(root, resolve, notice) {
    root.innerHTML = box(
      '<h1>Entrar</h1><p class="auth-sub">Acesso restrito às sócias da Vulpes.</p>' +
      '<form data-login novalidate>' +
      '<div class="field"><label for="a-email">E-mail</label><input class="input" id="a-email" type="email" autocomplete="username" required></div>' +
      '<div class="field"><label for="a-pass">Senha</label><input class="input" id="a-pass" type="password" autocomplete="current-password" required></div>' +
      '<button class="btn primary auth-btn" type="submit">Entrar</button>' +
      '<p class="auth-msg" data-msg></p>' +
      '<button class="auth-link" type="button" data-forgot>Primeiro acesso ou esqueci a senha</button>' +
      '</form>');
    if (notice) msg(root, notice.text, notice.bad);
    const form = root.querySelector('[data-login]');
    const btn = form.querySelector('button[type=submit]');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const email = form.querySelector('#a-email').value.trim().toLowerCase();
      const password = form.querySelector('#a-pass').value;
      if (!email || !password) { msg(root, 'Informe e-mail e senha.', true); return; }
      busy(btn, true, 'Entrar');
      const { error } = await client.auth.signInWithPassword({ email, password });
      busy(btn, false, 'Entrar');
      if (error) { msg(root, 'E-mail ou senha incorretos.', true); return; }
      checkSocia(root, resolve);
    });
    root.querySelector('[data-forgot]').addEventListener('click', () => forgotScreen(root, resolve, form.querySelector('#a-email').value.trim()));
    setTimeout(() => { const f = root.querySelector('#a-email'); if (f) f.focus(); }, 0);
  }

  function forgotScreen(root, resolve, email) {
    root.innerHTML = box(
      '<h1>Criar ou trocar senha</h1><p class="auth-sub">Enviamos um link para o seu e-mail. Abra o link neste aparelho e crie a senha.</p>' +
      '<form data-forgot-form novalidate>' +
      '<div class="field"><label for="f-email">E-mail</label><input class="input" id="f-email" type="email" autocomplete="username" required value="' + U.esc(email || '') + '"></div>' +
      '<button class="btn primary auth-btn" type="submit">Enviar link</button>' +
      '<p class="auth-msg" data-msg></p>' +
      '<button class="auth-link" type="button" data-back>Voltar para o login</button>' +
      '</form>');
    const form = root.querySelector('[data-forgot-form]');
    const btn = form.querySelector('button[type=submit]');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const value = form.querySelector('#f-email').value.trim().toLowerCase();
      if (!value) { msg(root, 'Informe o e-mail.', true); return; }
      busy(btn, true, 'Enviar link');
      await client.auth.resetPasswordForEmail(value, { redirectTo: window.location.origin + window.location.pathname });
      busy(btn, false, 'Enviar link');
      // Mesma resposta para qualquer e-mail: não revela quem tem conta.
      msg(root, 'Se este e-mail tiver acesso, o link chega em alguns minutos. Confira também o spam.');
    });
    root.querySelector('[data-back]').addEventListener('click', () => loginScreen(root, resolve));
  }

  function newPasswordScreen(root, resolve, isInvite) {
    root.innerHTML = box(
      '<h1>' + (isInvite ? 'Bem-vinda!' : 'Nova senha') + '</h1><p class="auth-sub">' +
      (isInvite ? 'Crie a sua senha para acessar o sistema.' : 'Escolha a nova senha de acesso.') + '</p>' +
      '<form data-pass-form novalidate>' +
      '<div class="field"><label for="p1">Senha</label><input class="input" id="p1" type="password" autocomplete="new-password" required minlength="8"><span class="hint">Pelo menos 8 caracteres.</span></div>' +
      '<div class="field"><label for="p2">Repita a senha</label><input class="input" id="p2" type="password" autocomplete="new-password" required></div>' +
      '<button class="btn primary auth-btn" type="submit">Salvar senha e entrar</button>' +
      '<p class="auth-msg" data-msg></p>' +
      '</form>');
    const form = root.querySelector('[data-pass-form]');
    const btn = form.querySelector('button[type=submit]');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const p1 = form.querySelector('#p1').value, p2 = form.querySelector('#p2').value;
      if (p1.length < 8) { msg(root, 'A senha precisa ter pelo menos 8 caracteres.', true); return; }
      if (p1 !== p2) { msg(root, 'As duas senhas não são iguais.', true); return; }
      busy(btn, true, 'Salvar senha e entrar');
      const { error } = await client.auth.updateUser({ password: p1 });
      busy(btn, false, 'Salvar senha e entrar');
      if (error) { msg(root, 'Não foi possível salvar a senha. O link pode ter expirado: peça outro.', true); return; }
      cleanUrl();
      checkSocia(root, resolve);
    });
  }

  async function checkSocia(root, resolve) {
    const { data: { session } } = await client.auth.getSession();
    if (!session) { loginScreen(root, resolve); return; }
    const { data, error } = await client.from('socias').select('nome,email').eq('user_id', session.user.id).maybeSingle();
    if (error || !data) {
      await client.auth.signOut();
      loginScreen(root, resolve, { text: 'Este e-mail não tem acesso ao sistema financeiro.', bad: true });
      return;
    }
    V.auth.user = { id: session.user.id, email: data.email, nome: data.nome };
    if (!/^#[a-z]/.test(window.location.hash)) cleanUrl();
    resolve(V.auth.user);
  }

  /* Mostra o login quando preciso e só libera o app com uma sócia logada. */
  function gate(root) {
    return new Promise(async (resolve) => {
      if (linkError) {
        cleanUrl();
        loginScreen(root, resolve, { text: 'O link não é mais válido. Peça um novo em "Primeiro acesso ou esqueci a senha".', bad: true });
        return;
      }
      const { data: { session } } = await client.auth.getSession();
      if (session && (linkType === 'invite' || linkType === 'recovery')) { newPasswordScreen(root, resolve, linkType === 'invite'); return; }
      if (session) { checkSocia(root, resolve); return; }
      loginScreen(root, resolve);
    });
  }

  async function signOut() {
    try { await client.auth.signOut(); } finally { window.location.hash = ''; window.location.reload(); }
  }

  V.auth = { client, gate, signOut, user: null, enabled: !!client };
})(window.Vulpes = window.Vulpes || {});
